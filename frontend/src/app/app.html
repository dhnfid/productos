<h1>Productos</h1>
<h2>PPPPPPP</h2>

<div class="products-container">
  @for (product of products; track product.id) {
    <button class="product-card">
      <img [src]="product.image" [alt]="product.name" width="200px" class="imagen">
      <h4 class="nombre">{{ product.name }}</h4>
      <div class="precio">
        ${{ product.price }}
      </div>
      
      
    </button>
  }
</div>
