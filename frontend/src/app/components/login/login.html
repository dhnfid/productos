<div class="login-container">
  <h2>Iniciar Sesión</h2>
  
  <form #loginForm="ngForm">
    <div class="form-group">
      <label for="email">Correo Electrónico:</label>
      <input 
        type="email" 
        id="email" 
        name="email" 
        [(ngModel)]="email" 
        required 
      />
    </div>

    <div class="form-group">
      <label for="pass">Contraseña:</label>
      <input 
        type="password" 
        id="pass" 
        name="pass" 
        [(ngModel)]="pass" 
        required 
      />
    </div>

    @if (errorMensaje) {
      <p style="color: red;">{{ errorMensaje }}</p>
    }

    <!-- IMPORTANTE: type="button" evita que el navegador dispare el submit nativo -->
    <button 
      type="button" 
      (click)="onSubmit(loginForm)" 
      [disabled]="loginForm.invalid || cargando">
      {{ cargando ? 'Ingresando...' : 'Ingresar' }}
    </button>
  </form>
</div>
